<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console RESILIENCE-ALPHA</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    bg: "#0b1017", panel: "#141e27", line: "#223041", fg: "#e8eef4", muted: "#8395a7",
    ok: "#35d07f", okbg: "#0f2a1d", crit: "#ff5c5c", critbg: "#2c1316", brand: "#38b6d6",
  }, fontFamily: {
    mono: ['"JetBrains Mono"', "ui-monospace", "Menlo", "monospace"],
    sans: ['"Inter"', "system-ui", "sans-serif"],
  } } } };
</script>
<style> html, body { background: #0b1017; color: #e8eef4; } </style>
</head>
<body class="font-sans">
<!-- RESILIENCE-ALPHA : barre de navigation commune -->
<style>
  .ra-nav{position:sticky;top:0;z-index:99999;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    background:#0b1017;border-bottom:1px solid #223041;padding:8px 14px;
    font-family:system-ui,-apple-system,sans-serif;font-size:13px}
  .ra-nav .ra-brand{color:#8395a7;font-weight:700;letter-spacing:.05em;margin-right:6px;font-size:12px}
  .ra-nav .ra-link{color:#cfe0ee;text-decoration:none;padding:5px 11px;border-radius:8px;
    border:1px solid transparent;transition:.15s}
  .ra-nav .ra-link:hover{border-color:#38b6d6;color:#fff}
  .ra-nav .ra-link.active{background:#38b6d6;color:#06240f;font-weight:600}
</style>
<nav class="ra-nav">
  <span class="ra-brand">RESILIENCE-ALPHA</span>
  <a href="http://localhost:8060" class="ra-link">Paiement</a>
  <a href="http://localhost:8070" class="ra-link active">Console</a>
  <a href="http://localhost:8050" class="ra-link">Supervision</a>
  <a href="http://localhost:8090" class="ra-link">Back-office</a>
  <a href="http://localhost:3000" class="ra-link">Grafana</a>
  <a href="https://localhost:8443" class="ra-link">Wazuh</a>
</nav>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect } = React;
const h = React.createElement;

// Scénarios d'attaque validés par la campagne de résilience (6/6).
const PROFILS = [
  { k: "flood",    nom: "Flood volumétrique",        sous: "120 workers · 18 s",            att: true },
  { k: "burst",    nom: "Burst intense",             sous: "160 workers · 15 s",            att: true },
  { k: "montee",   nom: "Montée progressive",        sous: "ramp 8 s → 140 workers · 24 s", att: true },
  { k: "pression", nom: "Pression modérée soutenue", sous: "85 workers · 16 s",             att: true },
  { k: "legitime", nom: "Charge légitime (contrôle)",sous: "15 workers espacés · 14 s",     att: false },
  { k: "sonde",    nom: "Sonde discrète (contrôle)", sous: "3 workers espacés · 10 s",       att: false },
];

function App() {
  const [st, setSt] = useState({ attack: false, traffic: false });
  const [log, setLog] = useState([]);
  const [question, setQuestion] = useState("Que faire en cas de DDoS ?");
  const [answer, setAnswer] = useState(null);
  const [asking, setAsking] = useState(false);

  async function askAssistant(e) {
    if (e) e.preventDefault();
    if (!question.trim()) return;
    setAsking(true); setAnswer(null);
    try {
      const r = await fetch("api/ask", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      }).then(r => r.json());
      setAnswer(r.answer || r.error || "Pas de réponse.");
    } catch {
      setAnswer("Assistant injoignable.");
    } finally { setAsking(false); }
  }

  async function refresh() {
    try { setSt(await fetch("api/status").then(r => r.json())); } catch {}
  }
  useEffect(() => { refresh(); const id = setInterval(refresh, 2000); return () => clearInterval(id); }, []);

  function note(msg) {
    const t = new Date().toLocaleTimeString("fr-FR");
    setLog(l => [`${t}  ${msg}`, ...l].slice(0, 8));
  }
  async function call(path, label) {
    try { const r = await fetch(path, { method: "POST" }).then(r => r.json()); note(r.message || label); refresh(); }
    catch { note("Erreur : service console injoignable"); }
  }
  async function callBody(path, body, label) {
    try {
      const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body) }).then(r => r.json());
      note(r.message || label); refresh();
    } catch { note("Erreur : service console injoignable"); }
  }

  const Btn = ({ onClick, children, tone }) =>
    h("button", { onClick, className:
      "rounded-lg px-5 py-3 font-medium text-sm transition w-full " + (
        tone === "crit" ? "bg-crit text-white hover:brightness-110" :
        tone === "ok" ? "bg-ok text-[#06240f] hover:brightness-110" :
        "bg-panel border border-line text-fg hover:border-brand") }, children);

  const Light = ({ on, label }) =>
    h("div", { className: "flex items-center gap-2 font-mono text-[12px]" },
      h("span", { className: "w-2.5 h-2.5 rounded-full " + (on ? "bg-crit" : "bg-muted") }),
      h("span", { className: on ? "text-crit" : "text-muted" }, label));

  return h("div", { className: "max-w-[720px] mx-auto px-4 py-6" },
    h("header", { className: "flex items-center justify-between flex-wrap gap-3 mb-6" },
      h("div", null,
        h("h1", { className: "font-mono text-lg tracking-wide" }, "CONSOLE DE DÉMONSTRATION"),
        h("div", { className: "text-muted text-[13px]" }, "Pilotage de l'attaque et du trafic — RESILIENCE-ALPHA")
      ),
      h("div", { className: "flex gap-4" },
        h(Light, { on: st.attack, label: st.attack ? "ATTAQUE EN COURS" : "attaque inactive" }),
        h(Light, { on: st.traffic, label: st.traffic ? "TRAFIC ACTIF" : "trafic inactif" })
      )
    ),

    // Trafic normal
    h("div", { className: "bg-panel border border-line rounded-xl p-5 mb-4" },
      h("div", { className: "font-mono text-[12px] uppercase tracking-wide text-muted mb-1" }, "1 · Trafic normal"),
      h("p", { className: "text-sm text-muted mb-4" }, "Simule l'activité clients. À lancer en premier pour que le service soit « vivant »."),
      h("div", { className: "grid grid-cols-2 gap-3" },
        h(Btn, { onClick: () => call("api/traffic/start"), tone: "ok" }, "▶ Démarrer le trafic"),
        h(Btn, { onClick: () => call("api/traffic/stop") }, "■ Arrêter le trafic")
      )
    ),

    // Attaque
    h("div", { className: "bg-panel border border-line rounded-xl p-5 mb-4" },
      h("div", { className: "font-mono text-[12px] uppercase tracking-wide text-muted mb-1" }, "2 · Attaque (déni de service)"),
      h("p", { className: "text-sm text-muted mb-4" }, "Flood HTTP sur l'API de paiement. Déclenche la détection puis la remédiation automatique."),
      h("div", { className: "grid grid-cols-2 gap-3 mb-4" },
        h(Btn, { onClick: () => call("api/attack/start"), tone: "crit" }, "⚡ Flood continu (manuel)"),
        h(Btn, { onClick: () => call("api/attack/stop") }, "■ Arrêter l'attaque")
      ),
      h("div", { className: "font-mono text-[11px] uppercase tracking-wide text-muted mb-2" },
        "Scénarios validés (campagne 6/6) — s'arrêtent seuls"),
      h("div", { className: "grid sm:grid-cols-2 gap-2.5" },
        PROFILS.map((p, i) => h("button", {
          key: i,
          onClick: () => callBody("api/attack/launch", { profile: p.k }, p.nom),
          className: "text-left rounded-lg px-4 py-2.5 border transition " + (
            p.att ? "bg-critbg border-crit hover:brightness-125" : "bg-okbg border-ok hover:brightness-125"),
        },
          h("div", { className: "text-sm font-medium " + (p.att ? "text-crit" : "text-ok") }, (p.att ? "⚡ " : "✓ ") + p.nom),
          h("div", { className: "text-[11px] text-muted font-mono mt-0.5" }, p.sous)
        ))
      ),
      h("p", { className: "text-[11px] text-muted mt-3 mb-3" },
        "Les deux « contrôles » (verts) sont des charges légitimes : ils ne doivent PAS déclencher la remédiation — preuve que le système ne surréagit pas."),
      h(Btn, { onClick: () => call("api/reset") }, "↺ Réinitialiser (débloque les IP + vide la timeline)")
    ),

    // Test paiement
    h("div", { className: "bg-panel border border-line rounded-xl p-5 mb-4" },
      h("div", { className: "font-mono text-[12px] uppercase tracking-wide text-muted mb-1" }, "3 · Vérifier le service"),
      h("p", { className: "text-sm text-muted mb-4" }, "Envoie une transaction unique pour vérifier l'état (avant, pendant, après l'incident)."),
      h(Btn, { onClick: () => call("api/test-payment") }, "✓ Envoyer une transaction de test")
    ),

    // Assistant RAG
    h("div", { className: "bg-panel border border-line rounded-xl p-5 mb-4" },
      h("div", { className: "font-mono text-[12px] uppercase tracking-wide text-muted mb-1" }, "4 · Assistant IA (RAG local)"),
      h("p", { className: "text-sm text-muted mb-4" }, "Pose une question sur l'infrastructure : l'IA cherche dans la base de connaissances (Qdrant) et répond via le LLM local."),
      h("form", { onSubmit: askAssistant, className: "flex gap-3 mb-3" },
        h("input", {
          type: "text", value: question, onChange: e => setQuestion(e.target.value),
          placeholder: "Ex. que faire en cas de latence élevée ?",
          className: "flex-1 min-w-0 rounded-lg bg-bg border border-line text-fg px-3 py-2.5 text-sm focus:outline-none focus:border-brand",
        }),
        h("button", {
          type: "submit", disabled: asking,
          className: "rounded-lg bg-brand text-[#06240f] font-medium px-5 py-2.5 text-sm hover:brightness-110 disabled:opacity-50 whitespace-nowrap",
        }, asking ? "Recherche…" : "Demander")
      ),
      asking && h("div", { className: "text-muted text-sm font-mono" }, "L'assistant consulte la documentation (quelques secondes)…"),
      answer && h("div", { className: "rounded-lg bg-bg border border-line p-4 text-[13.5px] leading-relaxed whitespace-pre-wrap text-fg" }, answer)
    ),

    // Journal
    h("div", { className: "bg-panel border border-line rounded-xl p-5" },
      h("div", { className: "font-mono text-[12px] uppercase tracking-wide text-muted mb-3" }, "Journal"),
      log.length
        ? h("div", { className: "font-mono text-[12.5px] space-y-1" }, log.map((l, i) => h("div", { key: i, className: "text-fg" }, l)))
        : h("div", { className: "text-muted text-sm" }, "Les actions s'afficheront ici.")
    ),

    h("p", { className: "text-center text-[11px] text-muted mt-5" },
      "Attaque strictement limitée au SI local RESILIENCE-ALPHA.")
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
