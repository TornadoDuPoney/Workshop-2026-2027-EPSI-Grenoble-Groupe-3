<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back-office RESILIENCE-ALPHA</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    bg: "#0b1017", panel: "#141e27", line: "#223041", fg: "#e8eef4", muted: "#8395a7",
    brand: "#38b6d6", ok: "#35d07f", okbg: "#0f2a1d", crit: "#ff5c5c", critbg: "#2c1316", warn: "#ffb020",
  }, fontFamily: {
    mono: ['"JetBrains Mono"', "ui-monospace", "Menlo", "monospace"],
    sans: ['"Inter"', "system-ui", "sans-serif"],
  } } } };
</script>
<style> html, body { background: #0b1017; color: #e8eef4; } </style>
</head>
<body class="font-sans">
<!-- RESILIENCE-ALPHA : barre de navigation commune -->
<style>
  .ra-nav{position:sticky;top:0;z-index:99999;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    background:#0b1017;border-bottom:1px solid #223041;padding:8px 14px;
    font-family:system-ui,-apple-system,sans-serif;font-size:13px}
  .ra-nav .ra-brand{color:#8395a7;font-weight:700;letter-spacing:.05em;margin-right:6px;font-size:12px}
  .ra-nav .ra-link{color:#cfe0ee;text-decoration:none;padding:5px 11px;border-radius:8px;
    border:1px solid transparent;transition:.15s}
  .ra-nav .ra-link:hover{border-color:#38b6d6;color:#fff}
  .ra-nav .ra-link.active{background:#38b6d6;color:#06240f;font-weight:600}
</style>
<nav class="ra-nav">
  <span class="ra-brand">RESILIENCE-ALPHA</span>
  <a href="http://localhost:8060" class="ra-link">Paiement</a>
  <a href="http://localhost:8070" class="ra-link">Console</a>
  <a href="http://localhost:8050" class="ra-link">Supervision</a>
  <a href="http://localhost:8090" class="ra-link active">Back-office</a>
  <a href="http://localhost:3000" class="ra-link">Grafana</a>
  <a href="https://localhost:8443" class="ra-link">Wazuh</a>
</nav>

<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect } = React;
const h = React.createElement;

async function api(path, method, body) {
  const opt = { method: method || "GET" };
  if (body) { opt.headers = { "Content-Type": "application/json" }; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  return r.json();
}

function Login() {
  const [step, setStep] = useState("identify");   // identify | password | granted
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState(null);           // {type, text}
  const [busy, setBusy] = useState(false);
  const [lock, setLock] = useState(0);
  const [role, setRole] = useState(null);

  useEffect(() => {
    if (lock <= 0) return;
    const id = setInterval(() => setLock(l => Math.max(0, l - 1)), 1000);
    return () => clearInterval(id);
  }, [lock]);

  async function doIdentify(e) {
    e.preventDefault();
    if (!username.trim()) return;
    setBusy(true); setMsg({ type: "info", text: "Activation de la caméra, vérification du visage…" });
    const r = await api("api/identify", "POST", { username });
    setBusy(false);
    if (r.locked) { setLock(r.retry_in || 300); setMsg({ type: "err", text: r.message }); setUsername(""); setStep("identify"); return; }
    if (r.step === "password") { setStep("password"); setMsg({ type: "ok", text: r.message }); }
    else { setMsg({ type: "err", text: r.message }); setUsername(""); }
  }

  async function doPassword(e) {
    e.preventDefault();
    setBusy(true); setMsg(null);
    const r = await api("api/password", "POST", { username, password });
    setBusy(false); setPassword("");
    if (r.granted) { setRole(r.role); setStep("granted"); }
    else { setStep("identify"); setUsername(""); setMsg({ type: "err", text: r.message }); }
  }

  function reset() {
    api("api/cancel", "POST").catch(() => {});   // éteint le voyant physique (annulation / déconnexion)
    setStep("identify"); setUsername(""); setPassword(""); setMsg(null); setRole(null);
  }

  const banner = msg && h("div", { className: "rounded-lg px-4 py-2.5 text-sm mb-4 " +
      (msg.type === "ok" ? "bg-okbg text-ok" : msg.type === "err" ? "bg-critbg text-crit" : "bg-panel text-muted border border-line") }, msg.text);

  if (step === "granted") {
    return h("div", { className: "bg-panel border border-ok rounded-2xl p-8 text-center" },
      h("div", { className: "text-ok text-5xl mb-3" }, "✓"),
      h("h2", { className: "text-xl font-semibold mb-1" }, "Accès autorisé"),
      h("p", { className: "text-muted text-sm mb-6" }, "Bienvenue — rôle : " + role),
      h("div", { className: "text-left bg-bg border border-line rounded-xl p-4 text-sm text-muted mb-6" },
        "Contenu du back-office (supervision, gestion du SI de paiement, configuration…)."),
      h("button", { onClick: reset, className: "rounded-lg bg-panel border border-line px-5 py-2.5 text-sm hover:border-brand" }, "Se déconnecter")
    );
  }

  return h("div", { className: "bg-panel border border-line rounded-2xl p-8" },
    h("div", { className: "flex items-center gap-2 mb-6" },
      h("span", { className: "w-2.5 h-2.5 rounded-full bg-brand" }),
      h("h2", { className: "font-mono text-sm tracking-wide" }, "AUTHENTIFICATION SÉCURISÉE")
    ),
    banner,
    lock > 0 && h("div", { className: "text-center text-crit font-mono text-sm mb-4" }, "Bloqué — " + lock + " s"),
    step === "identify"
      ? h("form", { onSubmit: doIdentify, className: "space-y-4" },
          h("label", { className: "block" },
            h("span", { className: "text-[12px] uppercase tracking-wide text-muted" }, "Identifiant"),
            h("input", { id: "username", type: "text", value: username, disabled: busy || lock > 0,
              onChange: e => setUsername(e.target.value), autoComplete: "username",
              className: "mt-1 w-full rounded-lg bg-bg border border-line px-3 py-2.5 focus:outline-none focus:border-brand disabled:opacity-50" })
          ),
          h("button", { type: "submit", disabled: busy || lock > 0,
            className: "w-full rounded-lg bg-brand text-[#06240f] font-medium py-2.5 hover:brightness-110 disabled:opacity-50" },
            busy ? "Vérification du visage…" : "S'identifier")
        )
      : h("form", { onSubmit: doPassword, className: "space-y-4" },
          h("div", { className: "text-sm text-muted" }, "Identifiant : ", h("span", { className: "text-fg font-mono" }, username)),
          h("label", { className: "block" },
            h("span", { className: "text-[12px] uppercase tracking-wide text-muted" }, "Mot de passe"),
            h("input", { id: "password", type: "password", value: password, disabled: busy, autoFocus: true,
              onChange: e => setPassword(e.target.value), autoComplete: "current-password",
              className: "mt-1 w-full rounded-lg bg-bg border border-line px-3 py-2.5 focus:outline-none focus:border-brand disabled:opacity-50" })
          ),
          h("div", { className: "flex gap-3" },
            h("button", { type: "submit", disabled: busy,
              className: "flex-1 rounded-lg bg-brand text-[#06240f] font-medium py-2.5 hover:brightness-110 disabled:opacity-50" }, "Valider"),
            h("button", { type: "button", onClick: reset,
              className: "rounded-lg bg-panel border border-line px-4 py-2.5 text-sm hover:border-brand" }, "Annuler")
          )
        ),
    h("p", { className: "text-[11px] text-muted mt-5 text-center" },
      "Reconnaissance faciale locale (caméra USB du PC Hôte) — aucune donnée biométrique ne quitte la machine.")
  );
}

function Admin() {
  const [users, setUsers] = useState([]);
  const [nu, setNu] = useState(""); const [np, setNp] = useState(""); const [nr, setNr] = useState("operateur");
  const [note, setNote] = useState(null);

  async function load() { const r = await api("api/admin/users"); setUsers(r.users || []); }
  useEffect(() => { load(); }, []);

  async function addUser(e) {
    e.preventDefault();
    if (!nu.trim() || !np) return;
    await api("api/admin/users", "POST", { username: nu, password: np, role: nr });
    setNu(""); setNp(""); setNote({ t: "ok", m: "Utilisateur ajouté. Pensez à enrôler son visage." }); load();
  }
  async function enroll(u) {
    setNote({ t: "info", m: `Enrôlement de ${u} : regardez la caméra, capture en cours…` });
    try { const r = await api("api/admin/enroll", "POST", { username: u });
      setNote({ t: "ok", m: `Visage enrôlé (${r.enrolment.echantillons_captures} échantillons).` }); }
    catch { setNote({ t: "err", m: "Échec de l'enrôlement (caméra ?)." }); }
    load();
  }
  async function del(u) { await api("api/admin/users/" + u, "DELETE"); load(); }

  return h("div", { className: "bg-panel border border-line rounded-2xl p-6" },
    h("h2", { className: "font-mono text-sm tracking-wide mb-4" }, "GESTION DES HABILITATIONS"),
    note && h("div", { className: "rounded-lg px-4 py-2.5 text-sm mb-4 " +
      (note.t === "ok" ? "bg-okbg text-ok" : note.t === "err" ? "bg-critbg text-crit" : "bg-bg border border-line text-muted") }, note.m),
    h("form", { onSubmit: addUser, className: "grid sm:grid-cols-[1fr_1fr_auto_auto] gap-3 items-end mb-6" },
      h("label", { className: "block" }, h("span", { className: "text-[11px] uppercase text-muted" }, "Identifiant"),
        h("input", { value: nu, onChange: e => setNu(e.target.value), className: "mt-1 w-full rounded-lg bg-bg border border-line px-3 py-2 text-sm focus:outline-none focus:border-brand" })),
      h("label", { className: "block" }, h("span", { className: "text-[11px] uppercase text-muted" }, "Mot de passe"),
        h("input", { type: "password", value: np, onChange: e => setNp(e.target.value), className: "mt-1 w-full rounded-lg bg-bg border border-line px-3 py-2 text-sm focus:outline-none focus:border-brand" })),
      h("label", { className: "block" }, h("span", { className: "text-[11px] uppercase text-muted" }, "Rôle"),
        h("select", { value: nr, onChange: e => setNr(e.target.value), className: "mt-1 rounded-lg bg-bg border border-line px-3 py-2 text-sm focus:outline-none focus:border-brand" },
          h("option", { value: "operateur" }, "Opérateur"), h("option", { value: "admin" }, "Admin"))),
      h("button", { type: "submit", className: "rounded-lg bg-brand text-[#06240f] font-medium px-4 py-2 text-sm hover:brightness-110" }, "Ajouter")
    ),
    users.length
      ? h("div", { className: "divide-y divide-line" }, users.map((u, i) =>
          h("div", { className: "flex items-center gap-3 py-2.5", key: i },
            h("div", { className: "font-mono text-sm" }, u.username),
            h("span", { className: "text-[11px] px-2 py-0.5 rounded bg-bg border border-line text-muted" }, u.role),
            h("span", { className: "text-[11px] px-2 py-0.5 rounded " + (u.enrolled ? "bg-okbg text-ok" : "bg-critbg text-crit") }, u.enrolled ? "visage enrôlé" : "non enrôlé"),
            h("div", { className: "ml-auto flex gap-2" },
              h("button", { onClick: () => enroll(u.username), className: "rounded-lg bg-panel border border-line px-3 py-1.5 text-xs hover:border-brand" }, "Enrôler le visage"),
              h("button", { onClick: () => del(u.username), className: "rounded-lg bg-panel border border-line px-3 py-1.5 text-xs hover:border-crit text-muted" }, "Supprimer")
            )
          )))
      : h("div", { className: "text-muted text-sm py-3" }, "Aucun utilisateur. Ajoutez-en un, puis enrôlez son visage.")
  );
}

function App() {
  const [tab, setTab] = useState("login");
  return h("div", { className: "max-w-[720px] mx-auto px-4 py-8" },
    h("header", { className: "flex items-center justify-between flex-wrap gap-3 mb-6" },
      h("div", null,
        h("h1", { className: "font-mono text-lg tracking-wide" }, "BACK-OFFICE RESILIENCE-ALPHA"),
        h("div", { className: "text-muted text-[13px]" }, "Accès sécurisé par reconnaissance faciale")
      ),
      h("div", { className: "flex gap-2" },
        h("button", { onClick: () => setTab("login"), className: "rounded-lg px-4 py-2 text-sm " + (tab === "login" ? "bg-brand text-[#06240f]" : "bg-panel border border-line") }, "Connexion"),
        h("button", { onClick: () => setTab("admin"), className: "rounded-lg px-4 py-2 text-sm " + (tab === "admin" ? "bg-brand text-[#06240f]" : "bg-panel border border-line") }, "Habilitations")
      )
    ),
    tab === "login" ? h(Login) : h(Admin)
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
