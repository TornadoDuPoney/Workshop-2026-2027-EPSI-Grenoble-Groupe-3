# RESILIENCE-ALPHA — orchestration du démonstrateur.
# Lancer depuis ce dossier :  docker compose up --build
# Réseaux segmentés : front (exposé via WAF), back (métier), obs (observabilité).

name: resilience

services:
  api-paiement:
    build: ../../services/api-paiement
    container_name: resilience-api-paiement
    environment:
      SATURATION_THRESHOLD: "40"
    networks: [back, obs]

  remediator:
    build: ../../services/remediator
    container_name: resilience-remediator
    environment:
      API_URL: "http://api-paiement:8000"
      API_CONTAINER: "resilience-api-paiement"
      WAF_CONTAINER: "resilience-waf"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.2:3b"
      QDRANT_URL: "http://qdrant:6333"
      EMBED_MODEL: "nomic-embed-text"
      KB_COLLECTION: "infra"
      SIEM_LOG: "/var/log/resilience/security.log"
    # Accès au socket Docker = droits élevés : isolé sur le réseau back, pas de port exposé.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../waf/scripts:/scripts:ro
      # Journal de sécurité partagé avec le SIEM Wazuh (montage hôte).
      - /var/log/resilience:/var/log/resilience
    networks: [back, obs]
    depends_on: [api-paiement, ollama, qdrant]

  ollama:
    image: ollama/ollama:0.3.12
    container_name: resilience-ollama
    # LLM installé LOCALEMENT : aucun appel externe au moment de l'analyse.
    # Le modèle est téléchargé une fois (voir README) puis persiste dans le volume.
    volumes:
      - ollama-models:/root/.ollama
    networks: [back]

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: resilience-qdrant
    # Base vectorielle LOCALE pour la recherche documentaire (RAG).
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks: [back]

  detector:
    build: ../../services/detector
    container_name: resilience-detector
    environment:
      PROM_URL: "http://prometheus:9090"
      REMEDIATOR_URL: "http://remediator:8000/alert"
      MODEL_PATH: "/models/detector_model.joblib"
    # Monte le modèle entraîné s'il existe (sinon repli par seuils) :
    volumes:
      - ../../ml:/models:ro
    networks: [back, obs]
    depends_on: [prometheus, remediator]

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: resilience-waf
    environment:
      BACKEND: "http://api-paiement:8000"
      SERVER_NAME: "localhost"
    ports:
      - "8080:8080"      # SEUL point d'entrée exposé au réseau du groupe
    volumes:
      - ../waf/scripts:/scripts
    networks: [front, back]
    depends_on: [api-paiement]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: resilience-prometheus
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [obs, back]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: resilience-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"   # changez-le, et pas de secret en clair au rendu
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    # Provisioning généré par Ansible (source de données + dashboard auto) :
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [obs]
    depends_on: [prometheus]

  # NB : la collecte/centralisation des logs est désormais assurée par Wazuh
  # (SIEM, voir infra/wazuh/). Loki et Promtail ont été retirés.

  dashboard:
    build: ../../services/dashboard
    container_name: resilience-dashboard
    environment:
      PROM_URL: "http://prometheus:9090"
      REMEDIATOR_URL: "http://remediator:8000"
    ports:
      - "8050:8000"      # interface de supervision : http://localhost:8050
    networks: [obs, back]
    depends_on: [prometheus, remediator]

  frontend:
    build: ../../services/frontend
    container_name: resilience-frontend
    environment:
      API_URL: "http://api-paiement:8000"
    ports:
      - "8060:8000"      # site de paiement : http://localhost:8060
    networks: [back]
    depends_on: [api-paiement]

  console:
    build: ../../services/console
    container_name: resilience-console
    environment:
      API_URL: "http://api-paiement:8000"
      TRAFFIC_GEN_URL: "http://traffic-gen:8000"
      REMEDIATOR_URL: "http://remediator:8000"
      ATTACK_WORKERS: "80"
    ports:
      - "8070:8000"      # console de démo : http://localhost:8070
    networks: [back]
    depends_on: [api-paiement, traffic-gen]

  traffic-gen:
    build: ../../services/traffic-gen
    container_name: resilience-traffic-gen
    # Générateur de trafic LÉGITIME : conteneur dédié = IP distincte de l'attaquant.
    # La remédiation bloque l'attaquant sans couper ce trafic (retour en NOMINAL).
    environment:
      API_URL: "http://api-paiement:8000"
      TRAFFIC_RPS: "10"
    networks: [back]
    depends_on: [api-paiement]

  face-reco:
    build: ../../services/face-reco
    container_name: resilience-face-reco
    # IA de reconnaissance faciale sur le PC Hôte : accès à la caméra USB.
    # /dev/video0 est le périphérique de la webcam branchée sur l'hôte.
    devices:
      - "/dev/video0:/dev/video0"
    environment:
      CAMERA_INDEX: "0"
    volumes:
      - face-data:/data
    ports:
      - "8091:8000"      # test : http://localhost:8091/camera
    networks: [back]

  backoffice:
    build: ../../services/backoffice
    container_name: resilience-backoffice
    environment:
      FACE_URL: "http://face-reco:8000"
      LED_URL: ""        # ESP32 : à renseigner (ex. http://192.168.1.50) quand prêt
    ports:
      - "8090:8000"      # back-office sécurisé : http://localhost:8090
    volumes:
      - backoffice-data:/data
    networks: [back]
    depends_on: [face-reco]

networks:
  front: {}
  back: {}
  obs: {}

volumes:
  ollama-models: {}
  qdrant-storage: {}
  face-data: {}
  backoffice-data: {}
