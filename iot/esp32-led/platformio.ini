; PROJECT RESILIENCE-ALPHA — objet connecté ESP32 (voyant rouge/vert).
; Ouvrable dans CLion (plugin PlatformIO) ou VS Code, ou en ligne de commande.
;
;   Compiler + téléverser :  pio run -t upload
;   Voir l'IP de l'objet   :  pio device monitor
;
; Carte : ESP32 (module ESP-WROOM-32, type DOIT DevKit v1).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
